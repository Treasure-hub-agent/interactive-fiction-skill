<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="ttl desc">
  <title id="ttl">玩法循环：你说开头 → 它写一段 → 你选 A–E</title>
  <desc id="desc">三步循环图：三块玻璃卡片依次是「你说开头」「它写一段」「你选 A–E」，卡片之间用箭头连接。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF5EA"/>
      <stop offset="1" stop-color="#F1E6D5"/>
    </linearGradient>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFC08A" stop-opacity="0.75"/><stop offset="1" stop-color="#FFB183" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9FCDF0" stop-opacity="0.70"/><stop offset="1" stop-color="#8BC0E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D3BCF2" stop-opacity="0.62"/><stop offset="1" stop-color="#B49AE0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.30" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="0.74" stop-color="#3C2D1E" stop-opacity="0.13"/><stop offset="1" stop-color="#3C2D1E" stop-opacity="0.26"/>
    </linearGradient>
    <filter id="lift" x="-14%" y="-20%" width="128%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#4A3A2A" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1280" height="300" fill="url(#paper)"/>
  <circle cx="200" cy="60" r="300" fill="url(#b1)"/>
  <circle cx="1080" cy="300" r="320" fill="url(#b2)"/>
  <circle cx="640" cy="320" r="280" fill="url(#b3)"/>

  <g font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">

    <!-- 卡 1 -->
    <rect x="80" y="44" width="320" height="190" rx="26" fill="url(#card)" filter="url(#lift)"/>
    <rect x="80.6" y="44.6" width="318.8" height="188.8" rx="25.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
    <text x="108" y="82" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2" fill="#3C2D1E" fill-opacity="0.36">01</text>
    <rect x="108" y="96" width="48" height="48" rx="15" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11" stroke-width="1"/>
    <g transform="translate(120,108)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19V5M12 5l-5 5M12 5l5 5"/>
    </g>
    <text x="108" y="184" font-size="18" font-weight="600" fill="#1B1712">你说开头</text>
    <text x="108" y="210" font-size="12.5" fill="#6E6154">一句话、一个念头，</text>
    <text x="108" y="228" font-size="12.5" fill="#6E6154">或「加载小说包」随机开局</text>

    <!-- 箭头 1 -->
    <line x1="410" y1="139" x2="466" y2="139" stroke="#3C2D1E" stroke-opacity="0.18" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="474" cy="139" r="4" fill="#E8925C"/>
    <circle cx="474" cy="139" r="9" fill="#E8925C" fill-opacity="0.16"/>

    <!-- 卡 2 -->
    <rect x="480" y="44" width="320" height="190" rx="26" fill="url(#card)" filter="url(#lift)"/>
    <rect x="480.6" y="44.6" width="318.8" height="188.8" rx="25.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
    <text x="508" y="82" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2" fill="#3C2D1E" fill-opacity="0.36">02</text>
    <rect x="508" y="96" width="48" height="48" rx="15" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11" stroke-width="1"/>
    <g transform="translate(520,108)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h11M4 12h8M4 18h13"/><path d="M19 9l2 2-2 2"/>
    </g>
    <text x="508" y="184" font-size="18" font-weight="600" fill="#1B1712">它写一段</text>
    <text x="508" y="210" font-size="12.5" fill="#6E6154">500–1200 字，视角与语态</text>
    <text x="508" y="228" font-size="12.5" fill="#6E6154">接着上一章，严丝合缝</text>

    <!-- 箭头 2 -->
    <line x1="810" y1="139" x2="866" y2="139" stroke="#3C2D1E" stroke-opacity="0.18" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="874" cy="139" r="4" fill="#E8925C"/>
    <circle cx="874" cy="139" r="9" fill="#E8925C" fill-opacity="0.16"/>

    <!-- 卡 3 -->
    <rect x="880" y="44" width="320" height="190" rx="26" fill="url(#card)" filter="url(#lift)"/>
    <rect x="880.6" y="44.6" width="318.8" height="188.8" rx="25.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
    <text x="908" y="82" font-family="ui-monospace,Consolas,monospace" font-size="11" letter-spacing="2" fill="#3C2D1E" fill-opacity="0.36">03</text>
    <rect x="908" y="96" width="48" height="48" rx="15" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11" stroke-width="1"/>
    <g transform="translate(920,108)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="7" rx="2.5"/><rect x="3" y="14" width="12" height="7" rx="2.5"/>
    </g>
    <text x="908" y="184" font-size="18" font-weight="600" fill="#1B1712">你选 A–E</text>
    <text x="908" y="210" font-size="12.5" fill="#6E6154">五条分支互不重复，</text>
    <text x="908" y="228" font-size="12.5" fill="#6E6154">也可以自由输入言行</text>

    <!-- 回环箭头 -->
    <path d="M1040 244 C1040 276 240 276 240 244" fill="none" stroke="#3C2D1E" stroke-opacity="0.14" stroke-width="1.4" stroke-dasharray="5 6"/>
    <text x="640" y="286" font-size="11.5" fill="#3C2D1E" fill-opacity="0.34" text-anchor="middle" letter-spacing="2">循环，直到你想收笔</text>
  </g>
</svg>
