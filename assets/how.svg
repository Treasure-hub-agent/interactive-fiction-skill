<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="ttl desc">
  <title id="ttl">玩法循环：你说开头 → 它写一段 → 你选 A–E</title>
  <desc id="desc">三步循环图：三块玻璃卡片依次是「你说开头」「它写一段」「你选 A–E」，箭头连接并回环。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF5EA"/><stop offset="1" stop-color="#F1E6D5"/>
    </linearGradient>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFC08A" stop-opacity="0.75"/><stop offset="1" stop-color="#FFB183" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9FCDF0" stop-opacity="0.70"/><stop offset="1" stop-color="#8BC0E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D3BCF2" stop-opacity="0.62"/><stop offset="1" stop-color="#B49AE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.30" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="0.74" stop-color="#3C2D1E" stop-opacity="0.13"/><stop offset="1" stop-color="#3C2D1E" stop-opacity="0.26"/>
    </linearGradient>
    <filter id="lift" x="-16%" y="-24%" width="132%" height="156%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#4A3A2A" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="960" height="260" fill="url(#paper)"/>
  <circle cx="150" cy="40" r="250" fill="url(#b1)"/>
  <circle cx="810" cy="250" r="270" fill="url(#b2)"/>
  <circle cx="480" cy="270" r="240" fill="url(#b3)"/>

  <g font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">

    <g>
      <rect x="24" y="30" width="280" height="170" rx="22" fill="url(#card)" filter="url(#lift)"/>
      <rect x="24.6" y="30.6" width="278.8" height="168.8" rx="21.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
      <text x="42" y="56" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="2" fill="#3C2D1E" fill-opacity="0.36">01</text>
      <rect x="42" y="72" width="40" height="40" rx="13" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11"/>
      <g transform="translate(52,82) scale(0.84)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5M12 5l-5 5M12 5l5 5"/>
      </g>
      <text x="42" y="148" font-size="15" font-weight="600" fill="#1B1712">你说开头</text>
      <text x="42" y="170" font-size="11.5" fill="#6E6154">一句话、一个念头，</text>
      <text x="42" y="187" font-size="11.5" fill="#6E6154">或「加载小说包」随机开局</text>
    </g>

    <line x1="310" y1="115" x2="326" y2="115" stroke="#3C2D1E" stroke-opacity="0.20" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="332" cy="115" r="3.4" fill="#E8925C"/><circle cx="332" cy="115" r="7.5" fill="#E8925C" fill-opacity="0.16"/>

    <g>
      <rect x="340" y="30" width="280" height="170" rx="22" fill="url(#card)" filter="url(#lift)"/>
      <rect x="340.6" y="30.6" width="278.8" height="168.8" rx="21.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
      <text x="358" y="56" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="2" fill="#3C2D1E" fill-opacity="0.36">02</text>
      <rect x="358" y="72" width="40" height="40" rx="13" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11"/>
      <g transform="translate(368,82) scale(0.84)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h11M4 12h8M4 18h13"/><path d="M19 9l2 2-2 2"/>
      </g>
      <text x="358" y="148" font-size="15" font-weight="600" fill="#1B1712">它写一段</text>
      <text x="358" y="170" font-size="11.5" fill="#6E6154">500–1200 字，视角与语态</text>
      <text x="358" y="187" font-size="11.5" fill="#6E6154">接着上一章，严丝合缝</text>
    </g>

    <line x1="626" y1="115" x2="642" y2="115" stroke="#3C2D1E" stroke-opacity="0.20" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="648" cy="115" r="3.4" fill="#E8925C"/><circle cx="648" cy="115" r="7.5" fill="#E8925C" fill-opacity="0.16"/>

    <g>
      <rect x="656" y="30" width="280" height="170" rx="22" fill="url(#card)" filter="url(#lift)"/>
      <rect x="656.6" y="30.6" width="278.8" height="168.8" rx="21.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
      <text x="674" y="56" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="2" fill="#3C2D1E" fill-opacity="0.36">03</text>
      <rect x="674" y="72" width="40" height="40" rx="13" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11"/>
      <g transform="translate(684,82) scale(0.84)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="7" rx="2.5"/><rect x="3" y="14" width="12" height="7" rx="2.5"/>
      </g>
      <text x="674" y="148" font-size="15" font-weight="600" fill="#1B1712">你选 A–E</text>
      <text x="674" y="170" font-size="11.5" fill="#6E6154">五条分支互不重复，</text>
      <text x="674" y="187" font-size="11.5" fill="#6E6154">也可以自由输入言行</text>
    </g>

    <path d="M800 212 C800 238 200 238 200 212" fill="none" stroke="#3C2D1E" stroke-opacity="0.15" stroke-width="1.3" stroke-dasharray="4 5"/>
    <text x="480" y="250" font-size="10.5" fill="#3C2D1E" fill-opacity="0.36" text-anchor="middle" letter-spacing="2">循环，直到你想收笔</text>
  </g>
</svg>
