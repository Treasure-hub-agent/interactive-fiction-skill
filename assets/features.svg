<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="ttl desc">
  <title id="ttl">interactive-fiction 六项核心能力</title>
  <desc id="desc">六块磨砂玻璃卡片：铁律 #0 五选项、角色卡、三档存档、三种调子、长线一致、酒馆卡直连。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF5EA"/>
      <stop offset="0.55" stop-color="#F5EBDB"/>
      <stop offset="1" stop-color="#EFE3D0"/>
    </linearGradient>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFC08A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFB183" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9FCDF0" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#8BC0E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D3BCF2" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#B49AE0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.30" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="0.74" stop-color="#3C2D1E" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#3C2D1E" stop-opacity="0.26"/>
    </linearGradient>
    <filter id="lift" x="-12%" y="-18%" width="124%" height="142%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4A3A2A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1280" height="500" fill="url(#paper)"/>
  <circle cx="250" cy="120" r="380" fill="url(#b1)"/>
  <circle cx="1080" cy="300" r="420" fill="url(#b2)"/>
  <circle cx="640" cy="500" r="380" fill="url(#b3)"/>

  <g font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">

    <!-- ===== 行 1 ===== -->
    <rect x="42" y="42" width="384" height="200" rx="26" fill="url(#card)" filter="url(#lift)"/>
    <rect x="42.6" y="42.6" width="382.8" height="198.8" rx="25.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
    <rect x="70" y="68" width="44" height="44" rx="14" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11" stroke-width="1"/>
    <g transform="translate(80,78)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16M4 12h9M4 18h12"/><circle cx="18.5" cy="12" r="2.6"/>
    </g>
    <text x="70" y="146" font-size="18" font-weight="600" fill="#1B1712">铁律 #0 · 五选项</text>
    <text x="70" y="172" font-size="13" fill="#6E6154">每轮正文后强制给出 A–E，正文结束不等于对话结束</text>
    <text x="70" y="212" font-family="ui-monospace,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">RULE #0</text>

    <rect x="448" y="42" width="384" height="200" rx="26" fill="url(#card)" filter="url(#lift)"/>
    <rect x="448.6" y="42.6" width="382.8" height="198.8" rx="25.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
    <rect x="476" y="68" width="44" height="44" rx="14" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11" stroke-width="1"/>
    <g transform="translate(486,78)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.6 3.4-6.2 7.5-6.2s7.5 2.6 7.5 6.2"/>
    </g>
    <text x="476" y="146" font-size="18" font-weight="600" fill="#1B1712">角色卡</text>
    <text x="476" y="172" font-size="13" fill="#6E6154">还原 / 自创 / 记忆人设，配角静默落卡不走样</text>
    <text x="476" y="212" font-family="ui-monospace,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">CAST</text>

    <rect x="854" y="42" width="384" height="200" rx="26" fill="url(#card)" filter="url(#lift)"/>
    <rect x="854.6" y="42.6" width="382.8" height="198.8" rx="25.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
    <rect x="882" y="68" width="44" height="44" rx="14" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11" stroke-width="1"/>
    <g transform="translate(892,78)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/>
    </g>
    <text x="882" y="146" font-size="18" font-weight="600" fill="#1B1712">三档存档</text>
    <text x="882" y="172" font-size="13" fill="#6E6154">轻量 / 持久 / 里程碑，断了能续，随时导出成书</text>
    <text x="882" y="212" font-family="ui-monospace,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">SAVE ×3</text>

    <!-- ===== 行 2 ===== -->
    <rect x="42" y="258" width="384" height="200" rx="26" fill="url(#card)" filter="url(#lift)"/>
    <rect x="42.6" y="258.6" width="382.8" height="198.8" rx="25.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
    <rect x="70" y="284" width="44" height="44" rx="14" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11" stroke-width="1"/>
    <g transform="translate(80,294)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l2.6 5.8 6.4.6-4.8 4.3 1.4 6.3L12 16.8 6.4 20l1.4-6.3L3 9.4l6.4-.6z"/>
    </g>
    <text x="70" y="362" font-size="18" font-weight="600" fill="#1B1712">三种调子</text>
    <text x="70" y="388" font-size="13" fill="#6E6154">主线 / 沉浸 / 爽文，同一部戏换一种讲法</text>
    <text x="70" y="428" font-family="ui-monospace,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">MODES</text>

    <rect x="448" y="258" width="384" height="200" rx="26" fill="url(#card)" filter="url(#lift)"/>
    <rect x="448.6" y="258.6" width="382.8" height="198.8" rx="25.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
    <rect x="476" y="284" width="44" height="44" rx="14" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11" stroke-width="1"/>
    <g transform="translate(486,294)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4v6M12 14v6M4 12h6M14 12h6"/><circle cx="12" cy="12" r="2.2"/>
    </g>
    <text x="476" y="362" font-size="18" font-weight="600" fill="#1B1712">长线一致</text>
    <text x="476" y="388" font-size="13" fill="#6E6154">设定核对 · 伏笔回收 · 视角与字数硬约束</text>
    <text x="476" y="428" font-family="ui-monospace,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">MEMORY</text>

    <rect x="854" y="258" width="384" height="200" rx="26" fill="url(#card)" filter="url(#lift)"/>
    <rect x="854.6" y="258.6" width="382.8" height="198.8" rx="25.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
    <rect x="882" y="284" width="44" height="44" rx="14" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11" stroke-width="1"/>
    <g transform="translate(892,294)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4h10a2 2 0 0 1 2 2v14l-7-3.5L5 20V6a2 2 0 0 1 2-2z"/>
    </g>
    <text x="882" y="362" font-size="18" font-weight="600" fill="#1B1712">酒馆卡直连</text>
    <text x="882" y="388" font-size="13" fill="#6E6154">PNG / JSON / CHARX 一句导入，原卡只读留档</text>
    <text x="882" y="428" font-family="ui-monospace,Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">V10.3</text>
  </g>
</svg>
