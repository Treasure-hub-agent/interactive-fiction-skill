<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="ttl desc">
  <title id="ttl">interactive-fiction 六项核心能力</title>
  <desc id="desc">六块磨砂玻璃卡片：铁律 #0 五选项、角色卡、三档存档、三种调子、长线一致、酒馆卡直连。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF5EA"/><stop offset="0.55" stop-color="#F5EBDB"/><stop offset="1" stop-color="#EFE3D0"/>
    </linearGradient>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFC08A" stop-opacity="0.85"/><stop offset="1" stop-color="#FFB183" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9FCDF0" stop-opacity="0.80"/><stop offset="1" stop-color="#8BC0E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D3BCF2" stop-opacity="0.70"/><stop offset="1" stop-color="#B49AE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.30" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="0.74" stop-color="#3C2D1E" stop-opacity="0.13"/><stop offset="1" stop-color="#3C2D1E" stop-opacity="0.26"/>
    </linearGradient>
    <filter id="lift" x="-14%" y="-22%" width="128%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4A3A2A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="960" height="400" fill="url(#paper)"/>
  <circle cx="190" cy="90" r="300" fill="url(#b1)"/>
  <circle cx="820" cy="240" r="330" fill="url(#b2)"/>
  <circle cx="480" cy="410" r="300" fill="url(#b3)"/>

  <g font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">

    <!-- 行 1 -->
    <g>
      <rect x="28" y="28" width="292" height="160" rx="22" fill="url(#card)" filter="url(#lift)"/>
      <rect x="28.6" y="28.6" width="290.8" height="158.8" rx="21.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
      <rect x="48" y="48" width="40" height="40" rx="13" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11"/>
      <g transform="translate(58,58) scale(0.84)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h9M4 18h12"/><circle cx="18.5" cy="12" r="2.6"/>
      </g>
      <text x="48" y="124" font-size="15" font-weight="600" fill="#1B1712">铁律 #0 · 五选项</text>
      <text x="48" y="146" font-size="12" fill="#6E6154">每轮必给 A–E 五选项</text>
      <text x="48" y="170" font-family="ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">RULE #0</text>
    </g>

    <g>
      <rect x="334" y="28" width="292" height="160" rx="22" fill="url(#card)" filter="url(#lift)"/>
      <rect x="334.6" y="28.6" width="290.8" height="158.8" rx="21.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
      <rect x="354" y="48" width="40" height="40" rx="13" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11"/>
      <g transform="translate(364,58) scale(0.84)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.6 3.4-6.2 7.5-6.2s7.5 2.6 7.5 6.2"/>
      </g>
      <text x="354" y="124" font-size="15" font-weight="600" fill="#1B1712">角色卡</text>
      <text x="354" y="146" font-size="12" fill="#6E6154">还原 / 自创 / 记忆人设</text>
      <text x="354" y="170" font-family="ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">CAST</text>
    </g>

    <g>
      <rect x="640" y="28" width="292" height="160" rx="22" fill="url(#card)" filter="url(#lift)"/>
      <rect x="640.6" y="28.6" width="290.8" height="158.8" rx="21.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
      <rect x="660" y="48" width="40" height="40" rx="13" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11"/>
      <g transform="translate(670,58) scale(0.84)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3.5" width="16" height="17" rx="3"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/>
      </g>
      <text x="660" y="124" font-size="15" font-weight="600" fill="#1B1712">三档存档</text>
      <text x="660" y="146" font-size="12" fill="#6E6154">断了能续，可导出成书</text>
      <text x="660" y="170" font-family="ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">SAVE ×3</text>
    </g>

    <!-- 行 2 -->
    <g>
      <rect x="28" y="204" width="292" height="160" rx="22" fill="url(#card)" filter="url(#lift)"/>
      <rect x="28.6" y="204.6" width="290.8" height="158.8" rx="21.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
      <rect x="48" y="224" width="40" height="40" rx="13" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11"/>
      <g transform="translate(58,234) scale(0.84)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l2.6 5.8 6.4.6-4.8 4.3 1.4 6.3L12 16.8 6.4 20l1.4-6.3L3 9.4l6.4-.6z"/>
      </g>
      <text x="48" y="300" font-size="15" font-weight="600" fill="#1B1712">三种调子</text>
      <text x="48" y="322" font-size="12" fill="#6E6154">主线 / 沉浸 / 爽文</text>
      <text x="48" y="346" font-family="ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">MODES</text>
    </g>

    <g>
      <rect x="334" y="204" width="292" height="160" rx="22" fill="url(#card)" filter="url(#lift)"/>
      <rect x="334.6" y="204.6" width="290.8" height="158.8" rx="21.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
      <rect x="354" y="224" width="40" height="40" rx="13" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11"/>
      <g transform="translate(364,234) scale(0.84)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v6M12 14v6M4 12h6M14 12h6"/><circle cx="12" cy="12" r="2.2"/>
      </g>
      <text x="354" y="300" font-size="15" font-weight="600" fill="#1B1712">长线一致</text>
      <text x="354" y="322" font-size="12" fill="#6E6154">设定核对 · 伏笔回收</text>
      <text x="354" y="346" font-family="ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">MEMORY</text>
    </g>

    <g>
      <rect x="640" y="204" width="292" height="160" rx="22" fill="url(#card)" filter="url(#lift)"/>
      <rect x="640.6" y="204.6" width="290.8" height="158.8" rx="21.4" fill="none" stroke="url(#ring)" stroke-width="1.2"/>
      <rect x="660" y="224" width="40" height="40" rx="13" fill="#FFFFFF" stroke="#3C2D1E" stroke-opacity="0.11"/>
      <g transform="translate(670,234) scale(0.84)" fill="none" stroke="#2B2119" stroke-opacity="0.82" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 4h10a2 2 0 0 1 2 2v14l-7-3.5L5 20V6a2 2 0 0 1 2-2z"/>
      </g>
      <text x="660" y="300" font-size="15" font-weight="600" fill="#1B1712">酒馆卡直连</text>
      <text x="660" y="322" font-size="12" fill="#6E6154">PNG / JSON / CHARX</text>
      <text x="660" y="346" font-family="ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1" fill="#3C2D1E" fill-opacity="0.34">V10.3</text>
    </g>
  </g>
</svg>
